name: server
services:
    nginx:
        build:
            context: sslProxy
        ports:
            - "443:443"
            - "80:80"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
    db:
        image: postgres:14.6
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        # Dev-only credentials, kept on purpose. Use real ones for any deployment.
        environment:
            POSTGRES_PASSWORD: "password"
            POSTGRES_DB: "mcos"
        restart: unless-stopped
    pgadmin:
        image: dpage/pgadmin4:6.18
        # Dev-only credentials, kept on purpose. Use real ones for any deployment.
        environment:
            PGADMIN_DEFAULT_EMAIL: "admin@pgadmin.com"
            PGADMIN_DEFAULT_PASSWORD: "password"
            PGADMIN_LISTEN_PORT: "80"
            POSTGRES_DB: "mcos"
        ports:
            - "15432:80"
        volumes:
            - pgadmin:/var/lib/pgadmin
        depends_on:
            - db
        restart: unless-stopped

volumes:
    pgadmin:
    db-data:
        driver: local    
