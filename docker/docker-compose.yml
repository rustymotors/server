name: server
services:
    nginx:
        build:
            context: sslProxy
        ports:
            - "127.0.0.1:9443:443"
            - "80:80"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
    db:
        image: postgres:14.6
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        # TODO: #1182 remove before prod https://github.com/drazisil/mco-server/issues/1008
        environment:
            POSTGRES_PASSWORD: "password"
            POSTGRES_DB: "mcos"
        restart: unless-stopped
    pgadmin:
        image: dpage/pgadmin4:6.18
        # TODO: #1182 remove these before prod https://github.com/drazisil/mco-server/issues/1008
        environment:
            PGADMIN_DEFAULT_EMAIL: "admin@pgadmin.com"
            PGADMIN_DEFAULT_PASSWORD: "password"
            PGADMIN_LISTEN_PORT: "80"
            POSTGRES_DB: "mcos"
        ports:
            - "15432:80"
        volumes:
            - pgadmin:/var/lib/pgadmin
        depends_on:
            - db
        restart: unless-stopped

    mcos:
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - "6660:6660"
            - "6660:6660/udp"
            - "7003:7003"
            - "7003:7003/udp"
            - "8226:8226"
            - "8226:8226/udp"
            - "8227:8227"
            - "8227:8227/udp"
            - "8228:8228"
            - "8228:8228/udp"
            - "9000-9020:9000-9020"
            - "9000-9020:9000-9020/udp"
            - "10001:10001"
            - "10001:10001/udp"
            - "43200:43200"
            - "43200:43200/udp"
            - "43300:43300"
            - "43300:43300/udp"
            - "43400:43400"
            - "43400:43400/udp"
            - "53303:53303"
            - "53303:53303/udp"
            - "3000:3000"
        volumes:
            - /data/Code/server:/app
        env_file:
            - /data/Code/server/.env
        environment:
            - DATABASE_URL=postgres://postgres:password@db:5432/mcos?sslmode=disable
            - GOOSE_DBSTRING=postgres://postgres:password@db:5432/mcos?sslmode=disable
        depends_on:
            - db
        restart: unless-stopped

volumes:
    pgadmin:
    db-data:
        driver: local

